{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:560px;margin:auto;text-align:center">
  <h2 style="margin-top:0">Capture scoresheets</h2>
  <p class="muted">Lay the sheet flat, fill the frame, all 4 black corner squares visible, no glare. One page per photo.</p>
  <form id="f" method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data">
    <input type="hidden" name="back" value="{{ url_for('capture') }}">
    <label class="btn big" style="display:block;margin:12px 0">📷 Take photo
      <input id="cam" type="file" name="photos" accept="image/*" capture="environment" style="display:none">
    </label>
    <label class="btn secondary big" style="display:block;margin:12px 0">🖼 Choose photos from library
      <input id="lib" type="file" name="photos" accept="image/*" multiple style="display:none">
    </label>
  </form>
  <p id="status" class="muted"></p>
  <p><a href="{{ url_for('review_list') }}">Go to review queue →</a></p>
</div>
<script>
  for (const id of ["cam","lib"]) {
    document.getElementById(id).addEventListener("change", e => {
      if (!e.target.files.length) return;
      document.getElementById("status").textContent = "Uploading " + e.target.files.length + " photo(s)...";
      // only submit the input that was used
      for (const other of ["cam","lib"]) if (other !== id) document.getElementById(other).disabled = true;
      document.getElementById("f").submit();
    });
  }
</script>
{% endblock %}
